name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push cancels an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Check host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ ! -s ~/.ssh/known_hosts ] || [ "$(tr -d '[:space:]' < ~/.ssh/known_hosts)" = "" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is empty or not visible to this job"
            exit 1
          fi
          echo "known_hosts has $(grep -cv '^#' ~/.ssh/known_hosts) entries"
          echo "--- fingerprints in SSH_KNOWN_HOSTS (public, safe to print):"
          ssh-keygen -lf ~/.ssh/known_hosts || echo "::error::SSH_KNOWN_HOSTS is not in known_hosts format"
          echo "--- fingerprints the server presents right now:"
          ssh-keyscan "$SSH_HOST" 2>/dev/null | ssh-keygen -lf - || true
          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::No known_hosts entry matches SSH_HOST exactly (hostname vs IP, or port mismatch?)"
            exit 1
          fi

      - name: Upload to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key" \
            .output/public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
